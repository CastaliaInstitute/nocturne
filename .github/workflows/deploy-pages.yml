name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - 'scripts/pwa-smoke.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch/ref whose pwa/ directory to publish (empty = the ref this workflow runs on)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PWA smoke test
        run: node scripts/pwa-smoke.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - name: Upload pwa/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
