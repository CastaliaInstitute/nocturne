name: Deploy PWA to GitHub Pages

on:
  push:
    # The feature-branch trigger registers this workflow so it can be
    # dispatched before it lands on main; remove it after merge.
    branches: [main, claude/cloudflare-tasks-b348mk]
    paths:
      - 'pwa/**'
      - 'scripts/pwa-smoke.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch/ref whose pwa/ directory to publish (empty = the ref this workflow runs on)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PWA smoke test
        run: node scripts/pwa-smoke.mjs
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository (API returned $status). Enable it under Settings -> Pages -> Source: GitHub Actions, then re-run this workflow. Skipping deploy."
          fi
      - name: Upload pwa/ as Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
