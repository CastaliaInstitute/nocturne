<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nocturne</title>
    <meta name="theme-color" content="#05070f" />
    <meta name="description" content="Nocturne — adaptive ambient sound." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
    <script defer src="ambient.js"></script>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <header class="topbar">
      <button id="sound-toggle" class="icon-btn" type="button" aria-label="Toggle sound" title="Sound">
        <svg id="icon-sound-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4V5z" />
          <path d="M15.5 8.5a5 5 0 0 1 0 7" />
          <path d="M18 6a8.5 8.5 0 0 1 0 12" />
        </svg>
        <svg id="icon-sound-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
          <path d="M11 5 6 9H3v6h3l5 4V5z" />
          <line x1="22" y1="9" x2="16" y2="15" />
          <line x1="16" y1="9" x2="22" y2="15" />
        </svg>
      </button>
      <button id="open-connect" class="connect-btn" type="button">Connect to Castalia</button>
    </header>

    <div id="drawer-backdrop" hidden></div>

    <aside id="connect-drawer" aria-hidden="true" aria-label="Castalia connection">
      <button id="close-drawer" class="icon-btn drawer-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
      </button>

      <section class="panel" id="auth-panel">
        <h2>Castalia Identity</h2>
        <div class="row">
          <button id="google-signin" type="button">Continue with Google</button>
          <button id="github-signin" type="button">Continue with GitHub</button>
        </div>
        <form id="magic-form">
          <label>
            Email for magic link
            <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <button type="submit">Send magic link</button>
        </form>
        <label>
          <input type="checkbox" id="consent-castalia-data" />
          I consent to loading Castalia repos and telemetry metadata only from my own scope.
        </label>
        <div class="row">
          <button id="logout" type="button">Sign out</button>
        </div>
        <p id="auth-status" class="status">Not connected</p>
        <p id="permission-status" class="status">Permission: Signed out</p>
      </section>

      <section class="panel">
        <h2>Castalia Repo Access</h2>
        <p>After sign-in and consent, the app can discover and read per-user repos: <code>castalia-{username}</code>.</p>
        <div class="row">
          <button id="discover-repo" disabled>Discover repo</button>
          <button id="open-repo" disabled>Open repo in GitHub</button>
          <button id="list-repo-files" disabled>List workspace files</button>
          <button id="list-recent-changes" disabled>Show recent changes</button>
        </div>
        <pre id="repo-list" class="mono">Files: none yet.</pre>
        <pre id="repo-commits" class="mono">Recent commits: none yet.</pre>
        <p id="repo-status" class="status"></p>
      </section>

      <section class="panel">
        <h2>Ring / Sensor BLE + Devices</h2>
        <label>
          <input type="checkbox" id="consent-ble" />
          I consent to pairing approved Bluetooth devices and reading sensor characteristics.
        </label>
        <div class="row">
          <button id="connect-device" disabled>Connect Ring/Device</button>
          <button id="disconnect-device" disabled>Disconnect</button>
        </div>
        <p id="ble-status" class="status">No connected device</p>
      </section>

      <section class="panel">
        <h2>Offline and Explainability</h2>
        <div class="row">
          <button id="test-offline" type="button">Generate Offline Snapshot</button>
          <button id="register-sw" type="button">Register Service Worker</button>
          <button id="export-data" type="button">Export Local Data</button>
          <button id="delete-data" type="button">Delete Local Data</button>
        </div>
        <pre id="log"></pre>
      </section>
    </aside>
  </body>
</html>
